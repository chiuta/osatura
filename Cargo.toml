[workspace]
resolver = "2"
members = [
  "osatura-core", "osatura-cli", "osatura-capi", "osatura-wasm", "osatura-gpu", "osatura-gui"]
# osatura-gpu (wgpu) is opt-in: plain `cargo test` / `cargo build` skip it. Use `-p osatura-gpu` or `--features gpu` on the CLI.
default-members = ["osatura-core", "osatura-cli", "osatura-capi", "osatura-wasm"]

[profile.release]
strip = "symbols"
# Integer overflow panics instead of wrapping silently. Release builds are what runs on other people's machines with
# files from other people: a wrapped size or index must stop the program (a panic is reported, never a corrupted
# result), not feed the next calculation. Code that wants wrapping says so (`wrapping_*`). The cost is a few percent.
overflow-checks = true
