[package]
name = "osatura-capi"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
description = "OSATURA C ABI: load a project, evaluate bones, render RGBA frames"
license = "MPL-2.0"

[lib]
name = "osatura_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
osatura-core = { path = "../osatura-core", default-features = false }

[target."cfg(windows)".build-dependencies]
winresource = { version = "0.1.34", default-features = false }  # Windows file metadata (product name, version) for code signing; MIT
