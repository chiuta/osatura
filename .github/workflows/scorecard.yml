# OpenSSF Scorecard: supply-chain checks, published to https://scorecard.dev/viewer/?uri=github.com/chiuta/osatura
name: scorecard
on:
  branch_protection_rule:
  schedule: [{ cron: "17 4 * * 1" }]
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: scorecard-sarif, path: results.sarif, retention-days: 5 }
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with: { sarif_file: results.sarif }
