#
# Builds the executables on GitHub-hosted runners (the authoring environment never builds --release).
#   * push to main        -> artifacts only (Actions tab, kept 30 days)
#   * tag v*, or a commit on main whose message contains "[release vX.Y.Z...]"
#                         -> the same, plus a DRAFT release with the archives, SHA-256 sums and signatures attached
#                            (a draft is visible only to people with write access; publish it by hand).
# Every run also signs the archives and the sums (Sigstore keyless + GitHub build provenance; job "sign").
# Each archive carries the licence texts, the third-party notices and the AGPL source offer note.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.ver.outputs.version }}   # the same in every matrix leg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, exe: osatura, lib: libosatura_capi.so, slib: libosatura_capi.a }
          - { name: macos-arm64, os: macos-latest, exe: osatura, lib: libosatura_capi.dylib, slib: libosatura_capi.a }
          - { name: windows-x86_64, os: windows-latest, exe: osatura.exe, lib: osatura_capi.dll, slib: osatura_capi.lib }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          toolchain: 1.97.0  # the SHA pin no longer carries the version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Release version (embedded in the Windows file metadata)
        id: ver
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          v=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"
          else v=$(printf '%s' "$MSG" | grep -o '\[release v[0-9][^]]*\]' | head -1 | sed 's/\[release v\(.*\)\]/\1/' || true); fi
          [ -n "$v" ] || v="$(grep -m1 '^version' osatura-cli/Cargo.toml | cut -d'"' -f2)-dev.${GITHUB_SHA::7}"
          echo "release version: $v"
          echo "OSATURA_VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build release binaries (CLI + studio, C ABI)
        env:
          OSATURA_REQUIRE_WIN_METADATA: "1"
          # AGPL section 13: the studio's /source page and `--version` point to the exact commit this binary is built from
          # (a fork that builds with its own workflow points to itself).
          OSATURA_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
        run: cargo build --release --locked -p osatura-cli -p osatura-capi -p osatura-gui
      - name: Smoke test the release binary
        shell: bash
        env:
          OSATURA_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
        run: |
          ./target/release/${{ matrix.exe }} --version | tee version.txt
          grep -q "available at: ${OSATURA_SOURCE_URL}" version.txt
          ./target/release/${{ matrix.exe }} demo smoke.json
          ./target/release/${{ matrix.exe }} check smoke.json
          ./target/release/${{ matrix.exe }} render smoke.json 0 smoke.png
          test -s smoke.png
          if [ "${{ runner.os }}" != "Linux" ]; then ./target/release/osatura-studio --selftest; fi
      - name: Check the Windows file metadata (required for code signing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in 'osatura.exe','osatura-studio.exe','osatura_capi.dll') {
            $i = (Get-Item "target/release/$f").VersionInfo
            "{0}: ProductName={1} ProductVersion={2} FileDescription={3} OriginalFilename={4}" -f $f, $i.ProductName, $i.ProductVersion, $i.FileDescription, $i.OriginalFilename
            if ($i.ProductName -ne 'OSATURA' -or $i.ProductVersion -ne $env:OSATURA_VERSION -or $i.OriginalFilename -ne $f) { throw "wrong metadata in $f" }
          }
      - name: Package
        shell: bash
        run: |
          d=osatura-${{ matrix.name }}
          mkdir -p $d/lib $d/include
          cp target/release/${{ matrix.exe }} $d/
          if [ "${{ runner.os }}" != "Linux" ]; then cp target/release/osatura-studio* $d/ ; fi
          cp target/release/${{ matrix.lib }} $d/lib/ || true
          cp target/release/${{ matrix.slib }} $d/lib/ || true
          cp osatura-capi/osatura.h $d/include/
          cp -r COPYRIGHT LICENSES README.md CHANGELOG.md TRADEMARK.md CODE_SIGNING_POLICY.md PRIVACY.md docs/UNINSTALL.md docs/THIRD_PARTY_NOTICES.md $d/
          printf 'OSATURA binaries: osatura (CLI + studio) is AGPL-3.0-or-later; the C library is MPL-2.0.\nCorresponding source: https://github.com/chiuta/osatura at the commit/tag of this build (%s).\n' "$GITHUB_SHA" > $d/SOURCE.txt
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a $d.zip $d >/dev/null; else tar czf $d.tar.gz $d; fi
          ls -la $d.* 
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osatura-${{ matrix.name }}
          path: |
            osatura-${{ matrix.name }}.tar.gz
            osatura-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 30

  wasm:
    name: wasm module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          toolchain: 1.97.0  # the SHA pin no longer carries the version
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the release module
        run: cargo build --release --target wasm32-unknown-unknown -p osatura-wasm --locked
      - name: Package
        run: |
          d=osatura-web
          mkdir -p $d
          cp target/wasm32-unknown-unknown/release/osatura_wasm.wasm $d/
          cp osatura-wasm/js/osatura.js osatura-wasm/index.html $d/
          cargo run --release --locked -p osatura-cli -- demo-person $d/demo-person.json
          cp -r LICENSES $d/ && cp COPYRIGHT $d/
          printf 'Module: MPL-2.0. Source: https://github.com/chiuta/osatura at %s\n' "$GITHUB_SHA" > $d/SOURCE.txt
          ls -la $d/osatura_wasm.wasm | tee wasm-size.txt
          tar czf osatura-web.tar.gz $d
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osatura-web
          path: osatura-web.tar.gz
          retention-days: 30

  windows-authenticode:
    # Authenticode signature of osatura.exe, osatura-studio.exe and osatura_capi.dll by SignPath Foundation
    # (CODE_SIGNING_POLICY.md). Runs only for releases and only once the repository variable SIGNPATH_ORGANIZATION_ID
    # and the secret SIGNPATH_API_TOKEN exist; until then the release ships without an OS signature (L-74).
    # A person approves every signing request in SignPath; the zip that comes back replaces the unsigned one.
    name: windows authenticode (SignPath Foundation)
    if: vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release v0') || contains(github.event.head_commit.message, '[release v1'))))
    needs: [cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # SignPath reads the run and downloads the unsigned artifact
    steps:
      - name: Find the unsigned Windows artifact
        id: art
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="osatura-windows-x86_64") | .id')
          test -n "$id" && echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: osatura
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-zip
          github-artifact-id: ${{ steps.art.outputs.id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(needs.cli.outputs.version) }}
      - name: Check that the files are signed
        run: |
          ls -la signed
          cd signed && unzip -q osatura-windows-x86_64.zip && sudo apt-get install -y -qq osslsigncode >/dev/null
          for f in osatura.exe osatura-studio.exe lib/osatura_capi.dll; do osslsigncode verify -in "osatura-windows-x86_64/$f" | grep -E "Signer|Subject:" | head -2; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osatura-windows-x86_64
          path: signed/osatura-windows-x86_64.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  sign:
    # Keyless signing: no key or secret is stored anywhere. The job's GitHub OIDC token is exchanged for a short-lived
    # Sigstore certificate that names this workflow, this repository and the ref; the signatures are logged in the public
    # Rekor transparency log. Verification: docs/VERIFY_DOWNLOADS.md.
    name: checksums, provenance and signatures
    needs: [cli, wasm, windows-authenticode]
    # runs when the Authenticode job succeeded or was skipped (not configured / not a release), never after a failure
    if: ${{ !cancelled() && needs.cli.result == 'success' && needs.wasm.result == 'success' && needs.windows-authenticode.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # mint the OIDC token for the Sigstore certificate
      attestations: write   # store the build-provenance attestations on GitHub
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 sums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build-provenance attestations (SLSA, verifiable with `gh attestation verify`)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Cosign keyless signatures (one Sigstore bundle per file)
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            test -s "$f.sigstore.json"
          done
          ls -la
      - name: Verify what was just signed (same commands as docs/VERIFY_DOWNLOADS.md)
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cd dist
          for f in *; do
            case "$f" in *.sigstore.json) continue;; esac
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null
            echo "verified: $f"
          done
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osatura-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: draft release (tags, or "[release vX]" commits)
    if: ${{ !cancelled() && needs.sign.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release v0') || contains(github.event.head_commit.message, '[release v1')))) }}
    needs: [sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: osatura-signed
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG=$(printf '%s' "$MSG" | grep -o '\[release v[0-9][^]]*\]' | head -1 | sed 's/\[release \(.*\)\]/\1/'); fi
          echo "tag: $TAG"
          # remove stale DRAFT releases that carry this tag or the placeholder tag 'vX' from earlier attempts
          for t in "$TAG" vX; do
            gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.draft and .tag_name==\"$t\") | .id" | while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done
          done
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --draft --prerelease --title "OSATURA $TAG" \
            --notes "Pre-release builds from CI. Unverified by people on Windows and macOS; see docs/LIMITATIONS.md. Licences: CLI AGPL-3.0-or-later, libraries MPL-2.0, docs CC-BY-4.0. Each file has a Sigstore signature (.sigstore.json) and a GitHub build-provenance attestation; see docs/VERIFY_DOWNLOADS.md. Code signing policy: https://github.com/chiuta/osatura/blob/main/CODE_SIGNING_POLICY.md . Privacy: the programs send nothing over the network unless you ask them to (PRIVACY.md). Uninstall: docs/UNINSTALL.md."
