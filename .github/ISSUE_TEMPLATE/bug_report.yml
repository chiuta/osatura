name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not attach files you may not share, and do not paste secrets or tokens.
        For security problems use the private route in docs/SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `osatura --version`, or the release you downloaded.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where does it happen?
      options: [Command line, Browser studio, Window app (osatura-gui), WebAssembly module (/try/), C library, Documentation, Website, Other]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and browser
      placeholder: "e.g. Windows 11, Firefox 130"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command or clicks, and a minimal project file if you can share one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
