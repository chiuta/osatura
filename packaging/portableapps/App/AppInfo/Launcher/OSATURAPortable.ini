; PortableApps.com Launcher configuration for OSATURA Portable.
; Build the launcher with the PortableApps.com Launcher Generator (Windows) pointed at this package folder.
;
; Nothing is written to the registry, to %APPDATA% or to Documents: the three environment variables below are read by
; OSATURA itself (OSATURA_UI_CONFIG: settings file; OSATURA_DOCUMENTS: folder of the first project) and by the
; WebView2 component of the window application (WEBVIEW2_USER_DATA_FOLDER: its cache, cookies and local storage).
[Launch]
ProgramExecutable=OSATURA\osatura-studio.exe
WorkingDirectory=%PAL:DataDir%\Projects
MinOS=10
SingleAppInstance=false
RunAsAdmin=none

[Activate]
Registry=false
Java=false

[Environment]
OSATURA_UI_CONFIG=%PAL:DataDir%\settings\ui.json
OSATURA_DOCUMENTS=%PAL:DataDir%\Projects
WEBVIEW2_USER_DATA_FOLDER=%PAL:DataDir%\WebView2
