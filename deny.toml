# cargo-deny configuration. Run: scripts/licence-audit.sh  (or: cargo deny --all-features check)
# Not legal advice. This file only polices third-party dependencies; the workspace crates themselves are MPL-2.0 (libraries) and AGPL-3.0-or-later (osatura-cli).
[graph]
all-features = true
# The window toolkit (wry / tao) is only a dependency on Windows and macOS (see osatura-gui/Cargo.toml); its Linux-only
# GTK dependencies are therefore not part of what ships. Judge every target that is built and shipped: the three
# platform archives, the static Linux (musl) archive and the WebAssembly module.
targets = [
  "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin",
  "x86_64-unknown-linux-musl", "wasm32-unknown-unknown",
]

[licenses]
confidence-threshold = 0.9
# Permissive licences accepted without review.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unlicense", "BSL-1.0",
  "CC0-1.0", "Unicode-3.0", "Unicode-DFS-2016",
]
# Weak copyleft that is accepted ONLY for the named crate (file-level copyleft, MPL-2.0).
# smartstring comes in through rhai, which is behind the `scripting` feature of osatura-core (on by default; `--no-default-features` builds without it).
exceptions = [
  { allow = ["MPL-2.0"], crate = "osatura-core" },
  { allow = ["MPL-2.0"], crate = "osatura-capi" },
  { allow = ["MPL-2.0"], crate = "osatura-wasm" },
  { allow = ["MPL-2.0"], crate = "osatura-gpu" },
  { allow = ["AGPL-3.0-or-later"], crate = "osatura-cli" },
  { allow = ["AGPL-3.0-or-later"], crate = "osatura-gui" },
  # MPL-2.0 (file-level copyleft, compatible with AGPL-3.0-or-later), pulled in by the window app's `dirs` dependency.
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # `smartstring` (via the scripting engine rhai) is licensed MPL-2.0+.
  { allow = ["MPL-2.0"], crate = "smartstring" },
]
# Anything else (GPL, LGPL, AGPL, EUPL, ...) is denied by default because it is not in `allow`.

[bans]
# Two versions of one crate are common in a tree this size and are not a risk by themselves.
multiple-versions = "allow"
# A path dependency inside the workspace is fine; `*` requirements on registry crates are not.
wildcards = "deny"
allow-wildcard-paths = true
# The programs send nothing over the network unless the user asks (PRIVACY.md); the studio and the collaboration server
# use the standard library's sockets and a small HTTP/1.1 parser of our own (docs/SECURITY.md). An HTTP client or
# a TLS stack must not enter the tree by accident: adding one is a deliberate change that removes its line here and
# updates PRIVACY.md and docs/SECURITY.md in the same pull request.
deny = [
  { name = "reqwest" },
  { name = "ureq" },
  { name = "hyper" },
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "rustls" },
  { name = "tokio-native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# A yanked release is withdrawn by its author, usually because of a defect or a vulnerability: refuse it.
yanked = "deny"
# Unmaintained crates are judged for the workspace's own direct dependencies only. Known transitive notices (not
# vulnerabilities), reviewed by 2026-12-01 or on the related upgrade, and therefore not listed as ignores because
# `workspace` mode does not report them: RUSTSEC-2026-0249 (`smartstring`, via rhai, optional `scripting` feature) and
# RUSTSEC-2024-0370 (`proc-macro-error`, build-time only, via the window toolkit wry/tao). If the mode is ever changed
# to `all`, add them here with a reason and a review date.
unmaintained = "workspace"
# An ignore that no longer matches anything is a stale entry: fail so that it is removed.
unused-ignored-advisory = "deny"
# Each ignore carries its reason and a review date. None at present.
ignore = []
